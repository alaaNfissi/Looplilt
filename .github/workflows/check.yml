name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run site
      - run: npm run pack
  browser-and-media:
    # Playwright 1.58 supports Ubuntu 24.04; keep browser dependencies reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run site
      - run: npm run test:browser
      - run: npm run test:site
      - run: npm run test:install
      - run: npm run test:remix
        env:
          LOOPLILT_TEST_MEDIA: '1'
      - run: node scripts/render-launch.mjs .validation/launch
      - run: node scripts/verify-launch.mjs .validation/launch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: looplilt-review-evidence
          path: .validation/
          include-hidden-files: true
          retention-days: 14
