name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:generated
      - run: npm test
      - run: npm run studio:setup
      - run: npm run studio:build
      - run: npm run studio:check
      - run: npm run site
      - run: npm run pack
  browser-and-media:
    # Playwright 1.58 supports Ubuntu 24.04; keep browser dependencies reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Allow Chromium sandbox namespaces on this runner
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' chromium_bins < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell \) -print0)
          if [ "${#chromium_bins[@]}" -eq 0 ]; then
            echo 'No installed Chromium executable found' >&2
            exit 1
          fi
          sandbox_profile="$RUNNER_TEMP/looplilt-playwright.apparmor"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n' > "$sandbox_profile"
          for i in "${!chromium_bins[@]}"; do
            printf 'profile looplilt-playwright-%s "%s" flags=(unconfined) {\n  userns,\n}\n' "$i" "${chromium_bins[$i]}" >> "$sandbox_profile"
          done
          # Exact installed paths only; Chromium's own sandbox stays enabled.
          sudo apparmor_parser --replace "$sandbox_profile"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run studio:setup
      - run: npm run studio:build
      - run: npm run studio:check
      - run: npm run test:graph-renderer
      - run: npm run test:legacy
      - run: npm run test:graph-audio
      - run: npm run test:graph-jobs
        env:
          LOOPLILT_DISABLE_GPU: '1'
      - run: npm run test:graph-shutdown
        env:
          LOOPLILT_DISABLE_GPU: '1'
      - run: npm run test:codec-failures
      - run: npm run test:studio-editing
      - run: npm run test:studio-projects
      - run: npm run test:studio-handoff
      - run: npm run test:studio-stories
      - run: npm run test:studio-complex
      - run: npm run site
      - run: npm run test:browser
      - run: npm run test:site
      - run: npm run test:studio-welcome
      - run: npm run test:workflow
        env:
          LOOPLILT_TEST_MEDIA: '1'
      - run: npm run test:install
      - run: npm run test:remix
        env:
          LOOPLILT_TEST_MEDIA: '1'
      - run: node scripts/render-launch.mjs .validation/launch
      - run: node scripts/verify-launch.mjs .validation/launch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: looplilt-review-evidence
          path: .validation/
          include-hidden-files: true
          retention-days: 14
